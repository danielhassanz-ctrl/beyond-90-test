name: V1 adviser identity continuity

on:
  push:
    branches:
      - v1-fix-professional-adviser-identity
  pull_request:
    branches:
      - main
    paths:
      - src/game/career-life.ts
      - scripts/adviser-choice-identity-smoke.ts
      - .github/workflows/v1-adviser-identity.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Adviser choice identity regression
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/adviser-choice-identity-smoke.ts
      - name: Mandatory life-first opening QA
        run: npm run qa:opening
      - name: Human-style first-15-decision QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/real-career-playtest-smoke.ts
      - name: Full-season boredom/coherence QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/full-season-boredom-smoke.ts
      - name: Career pacing QA
        run: npm run qa:pacing
      - name: Competition chronology QA
        run: npm run qa:competition-pacing
      - name: Persistent cast QA
        run: npm run qa:persistent-cast
      - name: Branch/narrative QA
        run: npm run qa:branches
      - name: Narrative anti-repetition QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/narrative-quality-smoke.ts
      - name: Full-career QA
        run: npm run qa:career
      - name: Extended gameplay QA
        run: node --import ./scripts/seed-ci-random.mjs --experimental-loader ./scripts/asset-loader.mjs --import tsx src/qa/run.ts
      - name: Build
        run: npm run build
