name: P0 real-career Story Director

on:
  push:
    branches:
      - p0-real-career-director-repetition
      - qa-decision-state-coherence
      - v1-first15-chronology-floor
      - p0-betis-injury-repro-gate
      - v1-p0-gate-self-protection
      - v1-webkit-first15-keymoment-transition
      - v1-p0-webkit-recovery-suite
  pull_request:
    branches:
      - main
    paths:
      - src/game/**
      - src/qa/**
      - scripts/asset-loader.mjs
      - scripts/seed-ci-random.mjs
      - scripts/opening-flow-smoke.ts
      - scripts/real-career-playtest-smoke.ts
      - scripts/first30-background-flash-smoke.ts
      - scripts/first15-chronology-smoke.ts
      - scripts/opening-intro-continuity-smoke.mjs
      - scripts/decision-state-coherence-smoke.ts
      - scripts/injury-director-chronology-smoke.ts
      - scripts/betis-injury-match-flash-regression-smoke.ts
      - scripts/full-season-boredom-smoke.ts
      - scripts/match-flash-source-ban-smoke.mjs
      - scripts/agent-market-chronology-smoke.mjs
      - scripts/apply-key-moment-antirepeat.mjs
      - scripts/apply-match-opponent-antirepeat.mjs
      - scripts/apply-playable-match-streak-gate.mjs
      - scripts/apply-minor-injury-card-dedupe.mjs
      - scripts/pacing-smoke.ts
      - scripts/competition-pacing-smoke.ts
      - scripts/persistent-cast-smoke.ts
      - scripts/branch-coverage-smoke.ts
      - scripts/narrative-quality-smoke.ts
      - scripts/thread-scheduler-smoke.ts
      - scripts/full-career-smoke.ts
      - scripts/browser-delivery.spec.cjs
      - scripts/browser-first15.spec.cjs
      - scripts/browser-life-patrimony-legacy.spec.cjs
      - scripts/browser-missing-primary-recovery.spec.cjs
      - scripts/browser-primary-write-fallback.spec.cjs
      - scripts/browser-freshest-slot-recovery.spec.cjs
      - scripts/browser-corrupt-primary-exact-recovery.spec.cjs
      - package.json
      - package-lock.json
      - docs/FOOTBALL_CAREER_STORY_DIRECTOR.md
      - qa/REAL_CAREER_PLAYTEST_GATE.md
      - .github/workflows/p0-real-career-director.yml
      - .github/workflows/pages.yml

permissions:
  contents: read

jobs:
  story-director:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ban playable match_flash emission at source
        run: node scripts/match-flash-source-ban-smoke.mjs

      - name: Lock youth agent market chronology
        run: node scripts/agent-market-chronology-smoke.mjs

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify clean dependency graph
        run: git diff --exit-code -- package-lock.json

      - name: Typecheck
        run: npm run typecheck

      - name: Mandatory life-first opening QA
        run: npm run qa:opening

      - name: Opening/persistent-cast intro continuity
        run: node scripts/opening-intro-continuity-smoke.mjs

      - name: Real-career first-15 human-style playtest
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/real-career-playtest-smoke.ts

      - name: First-30 background-flash/injury chronology playtest
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/first30-background-flash-smoke.ts

      - name: First-15 money/status/competition chronology
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/first15-chronology-smoke.ts

      - name: Per-decision career state coherence
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/decision-state-coherence-smoke.ts

      - name: Forced injured-player Story Director chronology
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/injury-director-chronology-smoke.ts

      - name: Exact Betis injured match-flash regression
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/betis-injury-match-flash-regression-smoke.ts

      - name: Full-season boredom/coherence playtest
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/full-season-boredom-smoke.ts

      - name: Pacing budget QA
        run: npm run qa:pacing

      - name: Competition chronology QA
        run: npm run qa:competition-pacing

      - name: Persistent cast QA
        run: npm run qa:persistent-cast

      - name: Branch/narrative QA
        run: npm run qa:branches

      - name: Narrative anti-repetition QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/narrative-quality-smoke.ts

      - name: Thread scheduler anti-starvation QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/thread-scheduler-smoke.ts

      - name: Full-career QA
        run: npm run qa:career

      - name: Extended gameplay QA
        run: node --import ./scripts/seed-ci-random.mjs --experimental-loader ./scripts/asset-loader.mjs --import tsx src/qa/run.ts

      - name: Build
        run: npm run build

      - name: Install WebKit test runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps webkit

      - name: Verify Playwright install did not mutate lockfile
        run: git diff --exit-code -- package-lock.json

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/beyond90-preview.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/beyond90-preview.log
          exit 1

      - name: iPhone WebKit delivery, persistence, recovery, and Life/Patrimony/Legacy
        run: npx playwright test scripts/browser-delivery.spec.cjs scripts/browser-first15.spec.cjs scripts/browser-life-patrimony-legacy.spec.cjs scripts/browser-missing-primary-recovery.spec.cjs scripts/browser-primary-write-fallback.spec.cjs scripts/browser-freshest-slot-recovery.spec.cjs scripts/browser-corrupt-primary-exact-recovery.spec.cjs --browser=webkit --reporter=line
