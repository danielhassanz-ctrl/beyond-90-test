name: V1 apply family location chronology

on:
  push:
    branches:
      - v1-family-location-chronology
    paths:
      - scripts/fix-v1-family-location-chronology.mjs
      - .github/workflows/v1-apply-family-location-chronology.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1-family-location-chronology
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply chronology fix
        run: node scripts/fix-v1-family-location-chronology.mjs
      - name: Commit source change
        run: |
          if git diff --quiet -- src/game/consequences.ts; then
            echo "No source change required"
            exit 0
          fi
          git config user.name "beyond90-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/game/consequences.ts
          git commit -m "V1: make family pressure location-aware"
          git push origin HEAD:v1-family-location-chronology
