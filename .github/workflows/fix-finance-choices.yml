name: Normalize finance choices

on:
  push:
    branches:
      - recovery-v4-19-delivery-gate
    paths:
      - scripts/fix-finance-choices.mjs
      - .github/workflows/fix-finance-choices.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery-v4-19-delivery-gate
          fetch-depth: 0
      - name: Patch finance choices
        run: node scripts/fix-finance-choices.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit finance fix
        shell: bash
        run: |
          if git diff --quiet -- src/game/finance.ts; then
            echo "Finance choices already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/finance.ts
          git commit -m "Normalize finance decisions to three choices"
          git push origin HEAD:recovery-v4-19-delivery-gate
