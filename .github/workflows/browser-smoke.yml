name: Beyond 90 iPhone WebKit smoke

on:
  push:
    branches:
      - main
      - "v1-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair career-end navigation with router Link
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/historia.tsx')
          text = path.read_text()
          text = text.replace(
              'import { createFileRoute } from "@tanstack/react-router";',
              'import { createFileRoute, Link } from "@tanstack/react-router";'
          )
          old = '''      <a
        href="./legado"
        className="gold-fill mt-5 block w-full rounded-xl px-5 py-3.5 text-center font-cond text-base font-bold uppercase tracking-[0.18em] active:scale-[0.99]"
      >
        Ver mi legado
      </a>'''
          new = '''      <Link
        to="/legado"
        className="gold-fill mt-5 block w-full rounded-xl px-5 py-3.5 text-center font-cond text-base font-bold uppercase tracking-[0.18em] active:scale-[0.99]"
      >
        Ver mi legado
      </Link>'''
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('career-end legacy navigation block not found')
          path.write_text(text)

          smoke = Path('scripts/browser-smoke.mjs')
          text = smoke.read_text()
          old_wait = '''  await page.getByRole("link", { name: "Ver mi legado" }).click();
  await page.waitForURL(/\/legado\/?$/, { timeout: 10_000 });
'''
          new_wait = '''  await page.getByRole("link", { name: "Ver mi legado" }).click();
  await page.waitForURL(/\/legado\/?$/, { timeout: 10_000 });
  const deployBasePath = new URL(baseURL).pathname.replace(/\/$/, "");
  const expectedLegacyPath = `${deployBasePath}/legado`.replace(/\/{2,}/g, "/");
  const actualLegacyPath = new URL(page.url()).pathname.replace(/\/$/, "");
  if (actualLegacyPath !== expectedLegacyPath) {
    throw new Error(`legacy route escaped deployment basepath: expected=${expectedLegacyPath} actual=${actualLegacyPath}`);
  }
'''
          if old_wait in text:
              text = text.replace(old_wait, new_wait)
          elif 'legacy route escaped deployment basepath' not in text:
              raise SystemExit('legacy smoke navigation block not found')
          smoke.write_text(text)
          PY

      - name: Commit source repair once
        run: |
          if git diff --quiet -- src/routes/historia.tsx scripts/browser-smoke.mjs; then
            echo 'Repair already present.'
          else
            git config user.name 'beyond90-qa-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add src/routes/historia.tsx scripts/browser-smoke.mjs
            git commit -m 'V1: use basepath-safe legacy navigation'
            git push origin HEAD:v1-legacy-link-basepath
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Install Playwright WebKit
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps webkit

      - name: Verify lockfile stayed unchanged
        run: git diff --exit-code -- package-lock.json

      - name: Typecheck
        run: npm run typecheck

      - name: Life and Patrimony chronology QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/money-life-chronology-smoke.ts

      - name: Decision/state coherence QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/decision-state-coherence-smoke.ts

      - name: Mandatory life-first opening QA
        run: npm run qa:opening

      - name: Career pacing QA
        run: npm run qa:pacing

      - name: Competition pacing QA
        run: npm run qa:competition-pacing

      - name: Persistent cast QA
        run: npm run qa:persistent-cast

      - name: Partner/social independence QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/partner-cast-smoke.ts

      - name: Full career smoke QA
        run: npm run qa:career

      - name: Targeted narrative branch QA
        run: npm run qa:branches

      - name: Narrative anti-repetition QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/narrative-quality-smoke.ts

      - name: Full-season boredom and repetition QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/full-season-boredom-smoke.ts

      - name: Narrative thread scheduler QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/thread-scheduler-smoke.ts

      - name: Match-flash source ban QA
        run: node scripts/match-flash-source-ban-smoke.mjs

      - name: Agent/market chronology QA
        run: node scripts/agent-market-chronology-smoke.mjs

      - name: Human-style first-15-decision QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/real-career-playtest-smoke.ts

      - name: First-15 decision quality floor
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/first15-quality-floor-smoke.ts

      - name: Alternative first-15 branch playtest
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/first15-branch-diversity-smoke.ts

      - name: Season title accounting QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/season-finance-title-bonus-smoke.ts

      - name: Retirement hard-cap QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/retirement-hard-cap-smoke.ts

      - name: Post-career Patrimony integration QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/postcareer-finance-integration-smoke.ts

      - name: Extended gameplay QA
        run: node --import ./scripts/seed-ci-random.mjs --experimental-loader ./scripts/asset-loader.mjs --import tsx src/qa/run.ts

      - name: Build GitHub Pages SPA
        env:
          DEPLOY_BASE: /beyond-90-test/
        run: npm run build

      - name: Prepare SPA entry at GitHub Pages base path
        run: |
          test -f dist/client/_shell.html
          rm -rf dist/client/beyond-90-test
          mkdir -p dist/client/beyond-90-test
          cp dist/client/_shell.html dist/client/beyond-90-test/index.html
          cp dist/client/_shell.html dist/client/beyond-90-test/404.html
          cp -R dist/client/assets dist/client/beyond-90-test/assets

      - name: Start production preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/beyond90-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/beyond-90-test/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/beyond90-preview.log
          exit 1

      - name: iPhone WebKit Nueva carrera, persistence and legacy smoke
        env:
          BEYOND90_URL: http://127.0.0.1:4173/beyond-90-test/
        run: node scripts/browser-smoke.mjs

      - name: iPhone WebKit save recovery regression suite
        env:
          TEST_BASE_URL: http://127.0.0.1:4173/beyond-90-test/
        run: npx playwright test scripts/browser-delivery.spec.cjs scripts/browser-missing-primary-recovery.spec.cjs scripts/browser-primary-write-fallback.spec.cjs --browser=webkit --reporter=line
