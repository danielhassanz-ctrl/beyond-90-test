name: Beyond 90 iPhone WebKit smoke

on:
  push:
    branches:
      - recovery-v4-19-delivery-gate
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright WebKit
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps webkit

      - name: Typecheck
        run: npm run typecheck

      - name: Career pacing QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/pacing-smoke.ts

      - name: Full career smoke QA
        run: npm run qa:career

      - name: Targeted narrative branch QA
        run: npm run qa:branches

      - name: Narrative anti-repetition QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/narrative-quality-smoke.ts

      - name: Extended gameplay QA
        run: node --import ./scripts/seed-ci-random.mjs --experimental-loader ./scripts/asset-loader.mjs --import tsx src/qa/run.ts

      - name: Build GitHub Pages SPA
        env:
          DEPLOY_BASE: /beyond-90-test/
        run: npm run build

      - name: Prepare SPA entry at GitHub Pages base path
        run: |
          test -f dist/client/_shell.html
          rm -rf dist/client/beyond-90-test
          mkdir -p dist/client/beyond-90-test
          cp dist/client/_shell.html dist/client/beyond-90-test/index.html
          cp dist/client/_shell.html dist/client/beyond-90-test/404.html
          cp -R dist/client/assets dist/client/beyond-90-test/assets

      - name: Start production preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/beyond90-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/beyond-90-test/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/beyond90-preview.log
          exit 1

      - name: iPhone WebKit Nueva carrera, persistence and legacy smoke
        env:
          BEYOND90_URL: http://127.0.0.1:4173/beyond-90-test/
        run: node scripts/browser-smoke.mjs