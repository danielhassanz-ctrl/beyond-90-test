name: Beyond 90 iPhone WebKit smoke

on:
  push:
    branches:
      - recovery-v4-19-delivery-gate
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright WebKit
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps webkit

      - name: Typecheck
        run: npm run typecheck

      - name: Build production SPA
        env:
          DEPLOY_BASE: /
        run: npm run build

      - name: Prepare SPA entry
        run: |
          test -f dist/client/_shell.html
          cp dist/client/_shell.html dist/client/index.html
          cp dist/client/_shell.html dist/client/404.html

      - name: Start production preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/beyond90-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/beyond90-preview.log
          exit 1

      - name: iPhone WebKit cold-start and first-flow smoke
        env:
          BEYOND90_URL: http://127.0.0.1:4173
        run: node scripts/browser-smoke.mjs

  public-url:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for exact production URL
        run: |
          URL='https://beyond-90-public-630f3c8-dani-ad1e.vercel.app'
          for i in {1..45}; do
            code=$(curl -L -sS -o /tmp/public.html -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ] && grep -qi 'BEYOND 90' /tmp/public.html; then
              echo "PUBLIC_URL_READY $URL"
              exit 0
            fi
            echo "attempt=$i status=$code"
            sleep 4
          done
          head -c 1000 /tmp/public.html || true
          exit 1

      - name: Install Playwright WebKit
        run: |
          npm install --no-audit --no-fund
          npm install --no-save @playwright/test
          npx playwright install --with-deps webkit

      - name: Exact public URL iPhone WebKit E2E
        env:
          BEYOND90_URL: https://beyond-90-public-630f3c8-dani-ad1e.vercel.app
        run: node scripts/browser-smoke.mjs
