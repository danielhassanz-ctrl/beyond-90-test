name: Apply person-owned thread resolutions

on:
  push:
    branches: [p0-person-owned-thread-resolutions]
    paths:
      - scripts/apply-person-owned-thread-resolutions.mjs
      - .github/workflows/apply-person-owned-thread-resolutions.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-person-owned-thread-resolutions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply narrative patch
        run: node scripts/apply-person-owned-thread-resolutions.mjs
      - name: Remove one-shot patch machinery
        run: rm scripts/apply-person-owned-thread-resolutions.mjs .github/workflows/apply-person-owned-thread-resolutions.yml
      - name: Run narrative and build gates
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit player-visible narrative change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/dynamic.ts scripts/apply-person-owned-thread-resolutions.mjs .github/workflows/apply-person-owned-thread-resolutions.yml
          git commit -m "Narrative P0: make recurring threads belong to real people"
          git push origin HEAD:p0-person-owned-thread-resolutions
