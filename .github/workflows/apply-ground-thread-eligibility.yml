name: Apply grounded thread eligibility

on:
  push:
    branches:
      - p0-ground-thread-eligibility
    paths:
      - scripts/apply-ground-thread-eligibility.mjs

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-ground-thread-eligibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply narrative eligibility patch
        run: node scripts/apply-ground-thread-eligibility.mjs
      - name: Remove one-shot patch machinery
        run: rm scripts/apply-ground-thread-eligibility.mjs .github/workflows/apply-ground-thread-eligibility.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/threads.ts scripts/apply-ground-thread-eligibility.mjs .github/workflows/apply-ground-thread-eligibility.yml
          git commit -m "Narrative P0: gate fame threads by earned career status" || exit 0
          git push origin HEAD:p0-ground-thread-eligibility
