name: Apply narrative P0 source fix

on:
  push:
    branches:
      - qa-narrative-repetition-v2
    paths:
      - scripts/remove-agent-check-source.mjs
      - .github/workflows/apply-narrative-p0.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa-narrative-repetition-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove legacy generic adviser card from source
        run: node scripts/remove-agent-check-source.mjs
      - name: Commit source fix if needed
        run: |
          if git diff --quiet -- src/game/engine.ts src/game/dynamic.ts; then
            echo "Source already clean"
            exit 0
          fi
          git config user.name "beyond90-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/game/engine.ts src/game/dynamic.ts
          git commit -m "Remove generic adviser check from narrative engine"
          git push origin HEAD:qa-narrative-repetition-v2
