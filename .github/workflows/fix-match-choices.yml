name: Normalize match key moments

on:
  push:
    branches:
      - recovery-v4-19-delivery-gate
    paths:
      - scripts/fix-match-choices.mjs
      - .github/workflows/fix-match-choices.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery-v4-19-delivery-gate
          fetch-depth: 0

      - name: Normalize key moments
        run: node scripts/fix-match-choices.mjs

      - name: Validate diff
        run: git diff --check

      - name: Commit normalized match bank
        shell: bash
        run: |
          if git diff --quiet -- src/game/match.ts; then
            echo "Match bank already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/match.ts
          git commit -m "Normalize match key moments to three choices"
          git push origin HEAD:recovery-v4-19-delivery-gate
