# trigger
name: Beyond 90 story lanes run2
on:
  push:
    branches: [recovery-v4-19-delivery-gate]
    paths: ['.github/workflows/story-lanes-run2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-v4-19-delivery-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/game/director.ts'); s=p.read_text()
          old='''  const pool = ARCS.filter(\n    (a) => !d.completed.includes(a.id) && !d.active.some((x) => x.id === a.id) && statusOk(s, a.family) && a.requires(s),\n  );\n  // Sorteo ponderado: la misma situación no produce siempre los mismos arcos.\n  const bag = pool.map((a) => ({ id: a.id, w: Math.max(1, a.weight(s)) + (hash(careerSeed(s), `${a.id}${s.seasonIndex}${d.profile}`) % 26) }));\n  const chosen: string[] = [];\n  const target = 3 + (hash(careerSeed(s), `ncand${s.seasonIndex}`) % 3);\n'''
          new='''  const contextualPool = ARCS.filter(\n    (a) => !d.completed.includes(a.id) && !d.active.some((x) => x.id === a.id) && statusOk(s, a.family) && a.requires(s),\n  );\n  const laneThreshold = s.stage === "youth" ? 55 : 65;\n  const lanePool = contextualPool.filter((a) => hash(careerSeed(s), `arc-lane|${d.profile}|${a.id}`) % 100 < laneThreshold);\n  const minLane = s.stage === "youth" ? 1 : 2;\n  const pool = lanePool.length >= minLane ? lanePool : contextualPool;\n  const bag = pool.map((a) => ({ id: a.id, w: Math.max(1, a.weight(s)) + (hash(careerSeed(s), `${a.id}${s.seasonIndex}${d.profile}`) % 26) }));\n  const chosen: string[] = [];\n  const wanted = s.stage === "youth" ? 1 + (hash(careerSeed(s), `ncand-youth${s.seasonIndex}`) % 2) : 2 + (hash(careerSeed(s), `ncand${s.seasonIndex}`) % 3);\n  const target = Math.min(pool.length, wanted);\n'''
          if old not in s: raise SystemExit('pool target missing')
          s=s.replace(old,new,1)
          old2='''  const beats = BEATS.filter((b) => !seen(s, b.id) && !familyBlocked(s, b.family) && statusOk(s, b.family) && b.requires(s));\n  if (beats.length > 0) {\n'''
          new2='''  const contextualBeats = BEATS.filter((b) => !seen(s, b.id) && !familyBlocked(s, b.family) && statusOk(s, b.family) && b.requires(s));\n  const laneBeats = contextualBeats.filter((b) => b.family === "rareza" || hash(careerSeed(s), `beat-lane|${d.profile}|${b.id}`) % 100 < 55);\n  const beats = laneBeats.length >= 2 ? laneBeats : contextualBeats;\n  if (beats.length > 0) {\n'''
          if old2 not in s: raise SystemExit('beat target missing')
          s=s.replace(old2,new2,1)
          s=s.replace('rareRoll < 30','rareRoll < 45',1)
          p.write_text(s)
          PY
      - run: npm install --no-audit --no-fund
      - name: Verify
        shell: bash
        run: |
          : > qa/overnight-status.txt
          echo "HEAD_BEFORE=$(git rev-parse HEAD)" >> qa/overnight-status.txt
          set +e
          npm run typecheck >> qa/overnight-status.txt 2>&1; echo "TYPECHECK_EXIT=$?" >> qa/overnight-status.txt
          npm run qa:career >> qa/overnight-status.txt 2>&1; echo "CAREER_EXIT=$?" >> qa/overnight-status.txt
          npm run qa:branches >> qa/overnight-status.txt 2>&1; echo "BRANCH_EXIT=$?" >> qa/overnight-status.txt
          node --import ./scripts/seed-ci-random.mjs --experimental-loader ./scripts/asset-loader.mjs --import tsx src/qa/run.ts >> qa/overnight-status.txt 2>&1; echo "EXTENDED_EXIT=$?" >> qa/overnight-status.txt
          npm run build >> qa/overnight-status.txt 2>&1; echo "BUILD_EXIT=$?" >> qa/overnight-status.txt
          set -e
      - name: Commit
        run: |
          rm -f .github/workflows/story-lanes.yml .github/workflows/story-lanes-run2.yml
          git config user.name "Beyond 90 QA"; git config user.email "actions@users.noreply.github.com"
          git add -A; git commit -m "Narrative: persistent per-career story lanes" || true
          git push origin HEAD:recovery-v4-19-delivery-gate
