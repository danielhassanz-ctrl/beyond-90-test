name: Apply narrative variety patch

on:
  push:
    branches:
      - recovery-v4-19-delivery-gate
    paths:
      - .github/workflows/narrative-variety-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-v4-19-delivery-gate
      - name: Apply guarded source changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/game/director.ts')
          s = p.read_text()

          old = '''  if (pre) {\n    const preMax = 1 + (hash(careerSeed(s), `pre${s.seasonIndex}`) % 2);\n    if ((d.preseasonUsed ?? 0) >= preMax) return null;\n    if (sinceAny(s, d) < 2) return null;\n  }\n\n  // 1. Callback pendiente'''
          new = '''  if (pre) {\n    const preMax = 1 + (hash(careerSeed(s), `pre${s.seasonIndex}`) % 2);\n    if ((d.preseasonUsed ?? 0) >= preMax) return null;\n    if (sinceAny(s, d) < 2) return null;\n\n    // La pretemporada debe sentirse al menos una vez cuando hay material válido.\n    // Antes competía con todos los arcos y podía desaparecer por completo.\n    const preBeats = BEATS.filter((b) => b.family === "pretemporada" && !seen(s, b.id) && b.requires(s));\n    if (preBeats.length > 0) {\n      const beat = preBeats[hash(careerSeed(s), `prebeat${s.seasonIndex}${d.preseasonUsed ?? 0}`) % preBeats.length]!;\n      d.lastBeatBeat = beatNow;\n      return { type: "dynamic", kind: "arc_beat", data: { beatId: beat.id } };\n    }\n  }\n\n  // 1. Callback pendiente'''
          if old not in s:
              raise SystemExit('guard failed: preseason block not found')
          s = s.replace(old, new, 1)

          old = '''    id: "beat_grupo_equivocado",\n    family: "humor",'''
          new = '''    id: "beat_grupo_equivocado",\n    family: "rareza",'''
          if old not in s:
              raise SystemExit('guard failed: wrong-group beat not found')
          s = s.replace(old, new, 1)

          old = '''  if (beats.length > 0) {\n    const h = hash(careerSeed(s), `beat${s.sceneCount ?? 0}`);\n    const beat = beats[h % beats.length]!;\n    d.lastBeatBeat = beatNow;\n    return { type: "dynamic", kind: "arc_beat", data: { beatId: beat.id } };\n  }'''
          new = '''  if (beats.length > 0) {\n    const h = hash(careerSeed(s), `beat${s.sceneCount ?? 0}`);\n    const rare = beats.filter((b) => b.family === "rareza");\n    const rareRoll = hash(careerSeed(s), `rare${beatNow}${s.seasonIndex}${s.sceneCount ?? 0}`) % 100;\n    const beat = rare.length > 0 && rareRoll < 24\n      ? rare[hash(careerSeed(s), `rarepick${s.sceneCount ?? 0}`) % rare.length]!\n      : beats[h % beats.length]!;\n    d.lastBeatBeat = beatNow;\n    return { type: "dynamic", kind: "arc_beat", data: { beatId: beat.id } };\n  }'''
          if old not in s:
              raise SystemExit('guard failed: beat selector not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "Beyond 90 QA"
          git config user.email "actions@users.noreply.github.com"
          git add src/game/director.ts
          git diff --cached --check
          git commit -m "Improve preseason presence and rare narrative beats"
          git push origin HEAD:recovery-v4-19-delivery-gate
