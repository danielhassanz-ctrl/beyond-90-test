name: Apply QA metrics correction

on:
  push:
    branches:
      - recovery-v4-19-delivery-gate
    paths:
      - .github/workflows/qa-metrics-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-v4-19-delivery-gate
      - name: Correct experience metrics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/qa/run.ts')
          s = p.read_text()

          old = '''      } else if (card.type === "dynamic") s = resolveDynamicCard(s, card, "ok");\n      else if (card.type === "season") { seasons++; s = advance(s); }\n    }\n    if (preseasonSeen < 2) preseasonMissing++;'''
          new = '''      } else if (card.type === "dynamic") {\n        // Narrative Director usa arc_beat para la pretemporada; el QA antiguo\n        // solo contaba eventos legacy y daba un falso negativo permanente.\n        if (s.flags["pretemporada"] === 1 && card.kind === "arc_beat") preseasonSeen++;\n        s = resolveDynamicCard(s, card, "ok");\n      } else if (card.type === "season") { seasons++; s = advance(s); }\n    }\n    // El diseño exige 1-2 momentos de pretemporada, no un mínimo artificial de 2.\n    if (preseasonSeen < 1) preseasonMissing++;'''
          if old not in s:
              raise SystemExit('guard failed: preseason QA block not found')
          s = s.replace(old, new, 1)

          old = '''  console.log(`Fase 5 · solapamiento de eventos entre carreras ${jac}% · pretemporadas cortas ${preseasonMissing}/12 · OVR final ${Math.min(...finals)}-${Math.max(...finals)}`);\n  if (jac > 78) console.log(`AVISO: carreras demasiado parecidas (${jac}%)`);\n  if (preseasonMissing > 3) console.log("AVISO: pretemporada poco presente");'''
          new = '''  console.log(`Fase 5 · solapamiento de eventos entre carreras ${jac}% · pretemporadas sin escena ${preseasonMissing}/12 · OVR final ${Math.min(...finals)}-${Math.max(...finals)}`);\n  if (jac > 78) console.log(`AVISO: carreras demasiado parecidas (${jac}%)`);\n  if (preseasonMissing > 3) console.log("AVISO: pretemporada poco presente");'''
          if old not in s:
              raise SystemExit('guard failed: preseason log block not found')
          s = s.replace(old, new, 1)

          old = '''  const N = 8;\n  const runs: { ids: string[]; fams: string[]; titles: string[] }[] = [];'''
          new = '''  const N = 8;\n  const runs: { ids: string[]; fams: string[]; titles: string[]; rareCount: number }[] = [];'''
          if old not in s:
              raise SystemExit('guard failed: experience run type not found')
          s = s.replace(old, new, 1)

          old = '''    const ids: string[] = []; const fams: string[] = []; const titles: string[] = [];\n    let guard = 0;'''
          new = '''    const ids: string[] = []; const fams: string[] = []; const titles: string[] = [];\n    let rareCount = 0;\n    let guard = 0;'''
          if old not in s:
              raise SystemExit('guard failed: experience arrays not found')
          s = s.replace(old, new, 1)

          old = '''      } else if (card.type === "dynamic") s = resolveDynamicCard(s, card, "ok");\n      else s = advance(s);\n    }\n    runs.push({ ids, fams, titles });'''
          new = '''      } else if (card.type === "dynamic") {\n        // Las escenas del Narrative Director son parte de la experiencia y deben\n        // entrar en variedad/rareza igual que los eventos legacy.\n        const dynamicKey = card.kind === "arc_beat"\n          ? String(card.data["beatId"] ?? "arc_beat")\n          : card.kind === "arc"\n            ? `${String(card.data["arcId"] ?? "arc")}:c${String(card.data["chapter"] ?? "?")}`\n            : card.kind === "arc_callback"\n              ? `callback:${String(card.data["cbId"] ?? "?")}`\n              : card.kind;\n        ids.push(`dynamic:${dynamicKey}`);\n        fams.push(`dynamic:${card.kind}`);\n        titles.push(dynamicKey);\n        if (card.kind === "arc_beat" && card.data["beatId"] === "beat_grupo_equivocado") rareCount++;\n        s = resolveDynamicCard(s, card, "ok");\n      } else s = advance(s);\n    }\n    runs.push({ ids, fams, titles, rareCount });'''
          if old not in s:
              raise SystemExit('guard failed: experience dynamic block not found')
          s = s.replace(old, new, 1)

          old = '''  const raros = runs.map((r) => r.ids.filter((id) => eventById(id)?.rare).length);\n  console.log(`Experiencia · escenas raras por carrera (30 escenas): ${raros.join(",")}`);'''
          new = '''  const raros = runs.map((r) => r.ids.filter((id) => !id.startsWith("dynamic:") && eventById(id)?.rare).length + r.rareCount);\n  console.log(`Experiencia · escenas raras por carrera (30 escenas): ${raros.join(",")}`);'''
          if old not in s:
              raise SystemExit('guard failed: rare metric not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit QA correction
        run: |
          git config user.name "Beyond 90 QA"
          git config user.email "actions@users.noreply.github.com"
          git add src/qa/run.ts
          git diff --cached --check
          git commit -m "Measure Director preseason and rare scenes in QA"
          git push origin HEAD:recovery-v4-19-delivery-gate
