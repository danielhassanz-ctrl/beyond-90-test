name: Apply thread follow-up evolution

on:
  push:
    branches:
      - p0-seasonal-relationship-arcs
    paths:
      - scripts/apply-thread-followup-evolution.mjs
      - .github/workflows/apply-thread-followup-evolution.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-seasonal-relationship-arcs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply narrative follow-up patch
        run: node scripts/apply-thread-followup-evolution.mjs
      - name: Remove one-shot patch machinery
        run: rm scripts/apply-thread-followup-evolution.mjs .github/workflows/apply-thread-followup-evolution.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/dynamic.ts src/game/threads.ts scripts/apply-thread-followup-evolution.mjs .github/workflows/apply-thread-followup-evolution.yml
          git commit -m "Narrative P0: evolve recurring relationship threads" || exit 0
          git push origin HEAD:p0-seasonal-relationship-arcs
