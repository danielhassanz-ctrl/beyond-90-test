name: Choice consequence divergence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  choice-consequences:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Verify early-career choices have distinct consequences
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/choice-consequence-divergence-smoke.ts
