name: Beyond 90 early contextual beats
on:
  push:
    branches: [recovery-v4-19-delivery-gate]
    paths: ['.github/workflows/early-context-beats.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-v4-19-delivery-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add contextual beats and restore best lane settings
        env:
          CONTEXT_BEATS_Z64: "" 
        run: |
          python3 - <<'PY'
          import base64,zlib,os
          from pathlib import Path
          p=Path('src/game/director.ts'); s=p.read_text()
          s=s.replace('const laneThreshold = s.stage === "youth" ? 50 : 60;', 'const laneThreshold = s.stage === "youth" ? 55 : 65;', 1)
          s=s.replace('`beat-lane|${d.profile}|${b.id}`) % 100 < 48', '(["rareza", "posicion", "origen"].includes(b.family) || hash(careerSeed(s), `beat-lane|${d.profile}|${b.id}`) % 100 < 55)', 1)
          marker='''const BEATS: Beat[] = [\n'''
          if 'id: "beat_pos_dc"' not in s:
            payload=zlib.decompress(base64.b64decode(os.environ['CONTEXT_BEATS_Z64'])).decode()
            if marker not in s: raise SystemExit('BEATS marker missing')
            s=s.replace(marker,marker+payload,1)
          p.write_text(s)
          PY
      - run: npm install --no-audit --no-fund
      - name: Verify
        shell: bash
        run: |
          : > qa/overnight-status.txt
          echo "HEAD_BEFORE=$(git rev-parse HEAD)" >> qa/overnight-status.txt
          set +e
          npm run typecheck >> qa/overnight-status.txt 2>&1; echo "TYPECHECK_EXIT=$?" >> qa/overnight-status.txt
          npm run qa:career >> qa/overnight-status.txt 2>&1; echo "CAREER_EXIT=$?" >> qa/overnight-status.txt
          npm run qa:branches >> qa/overnight-status.txt 2>&1; echo "BRANCH_EXIT=$?" >> qa/overnight-status.txt
          node --import ./scripts/seed-ci-random.mjs --experimental-loader ./scripts/asset-loader.mjs --import tsx src/qa/run.ts >> qa/overnight-status.txt 2>&1; echo "EXTENDED_EXIT=$?" >> qa/overnight-status.txt
          npm run build >> qa/overnight-status.txt 2>&1; echo "BUILD_EXIT=$?" >> qa/overnight-status.txt
          set -e
      - name: Commit
        run: |
          rm -f .github/workflows/early-context-beats.yml
          git config user.name "Beyond 90 QA"; git config user.email "actions@users.noreply.github.com"
          git add -A; git commit -m "Narrative: add contextual early-career scene pools" || true
          git push origin HEAD:recovery-v4-19-delivery-gate
