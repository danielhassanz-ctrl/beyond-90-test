name: Beyond 90 public delivery

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Full career QA
        run: npm run qa:career

      - name: Branch QA
        run: npm run qa:branches

      - name: Narrative anti-repetition QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/narrative-quality-smoke.ts

      - name: Extended gameplay QA
        run: node --import ./scripts/seed-ci-random.mjs --experimental-loader ./scripts/asset-loader.mjs --import tsx src/qa/run.ts

      - name: Build static SPA
        env:
          DEPLOY_BASE: /beyond-90-test/
        run: npm run build

      - name: Prepare SPA fallbacks
        run: |
          test -f dist/client/_shell.html
          cp dist/client/_shell.html dist/client/index.html
          cp dist/client/_shell.html dist/client/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-public-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright WebKit
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps webkit

      - name: Wait for public HTTPS
        env:
          BEYOND90_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for i in {1..30}; do
            if curl -fsS "${BEYOND90_URL}" | grep -qi "Beyond 90"; then exit 0; fi
            sleep 2
          done
          curl -i "${BEYOND90_URL}" || true
          exit 1

      - name: iPhone WebKit public E2E with persistence
        env:
          BEYOND90_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/browser-smoke.mjs
