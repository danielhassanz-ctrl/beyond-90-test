name: Beyond 90 static delivery bundle

on:
  push:
    branches:
      - recovery-v4-19-delivery-gate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-bundle
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build static SPA
        env:
          DEPLOY_BASE: /
        run: npm run build

      - name: Prepare SPA fallbacks
        run: |
          test -f dist/client/_shell.html
          cp dist/client/_shell.html dist/client/index.html
          cp dist/client/_shell.html dist/client/404.html

      - name: Upload static delivery bundle
        uses: actions/upload-artifact@v4
        with:
          name: beyond90-static-delivery
          path: dist/client
          if-no-files-found: error
          retention-days: 7
