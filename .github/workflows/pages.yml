name: Beyond 90 public delivery

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Mandatory life-first opening QA
        run: npm run qa:opening

      - name: Career pacing QA
        run: npm run qa:pacing

      - name: Competition pacing QA
        run: npm run qa:competition-pacing

      - name: Persistent cast QA
        run: npm run qa:persistent-cast

      - name: Full career QA
        run: npm run qa:career

      - name: Branch QA
        run: npm run qa:branches

      - name: Narrative anti-repetition QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/narrative-quality-smoke.ts

      - name: Human-style first-15-decision QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/real-career-playtest-smoke.ts

      - name: First-15 decision quality floor
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/first15-quality-floor-smoke.ts

      - name: Alternative first-15 branch playtest
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/first15-branch-diversity-smoke.ts

      - name: Extended gameplay QA
        run: node --import ./scripts/seed-ci-random.mjs --experimental-loader ./scripts/asset-loader.mjs --import tsx src/qa/run.ts

      - name: Build static SPA
        env:
          DEPLOY_BASE: /beyond-90-test/
        run: npm run build

      - name: Prepare SPA fallbacks
        run: |
          test -f dist/client/_shell.html
          cp dist/client/_shell.html dist/client/index.html
          cp dist/client/_shell.html dist/client/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public HTTPS delivery
        env:
          SITE_URL: https://danielhassanz-ctrl.github.io/beyond-90-test/
        run: |
          set -euo pipefail
          case "$SITE_URL" in
            https://*) ;;
            *) echo "Public delivery is not HTTPS: $SITE_URL" >&2; exit 1 ;;
          esac

          curl --fail --show-error --silent --location \
            --retry 10 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "$SITE_URL" -o /tmp/beyond90-root.html
          test -s /tmp/beyond90-root.html
          grep -Eqi '<html|<div[^>]+id=["'"']root["'"']|beyond[ -]?90' /tmp/beyond90-root.html

          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "${SITE_URL}404.html" -o /tmp/beyond90-404.html
          test -s /tmp/beyond90-404.html
          grep -Eqi '<html|<div[^>]+id=["'"']root["'"']|beyond[ -]?90' /tmp/beyond90-404.html
