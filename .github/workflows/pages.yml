name: Beyond 90 public delivery

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify clean dependency graph
        run: git diff --exit-code -- package-lock.json

      - name: Ban playable match_flash emission at source
        run: node scripts/match-flash-source-ban-smoke.mjs

      - name: Lock youth agent market chronology
        run: node scripts/agent-market-chronology-smoke.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Mandatory life-first opening QA
        run: npm run qa:opening

      - name: Opening/persistent-cast intro continuity
        run: node scripts/opening-intro-continuity-smoke.mjs

      - name: Human-style first-15-decision QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/real-career-playtest-smoke.ts

      - name: First-15 money/status/competition chronology
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/first15-chronology-smoke.ts

      - name: Per-decision career state coherence
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/decision-state-coherence-smoke.ts

      - name: Forced injured-player Story Director chronology
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/injury-director-chronology-smoke.ts

      - name: Full-season boredom and coherence QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/full-season-boredom-smoke.ts

      - name: First-15 decision quality floor
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/first15-quality-floor-smoke.ts

      - name: Alternative first-15 branch playtest
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/first15-branch-diversity-smoke.ts

      - name: Career pacing QA
        run: npm run qa:pacing

      - name: Competition pacing QA
        run: npm run qa:competition-pacing

      - name: Persistent cast QA
        run: npm run qa:persistent-cast

      - name: Full career QA
        run: npm run qa:career

      - name: Branch QA
        run: npm run qa:branches

      - name: Narrative anti-repetition QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/narrative-quality-smoke.ts

      - name: Thread scheduler anti-starvation QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/thread-scheduler-smoke.ts

      - name: Extended gameplay QA
        run: node --import ./scripts/seed-ci-random.mjs --experimental-loader ./scripts/asset-loader.mjs --import tsx src/qa/run.ts

      - name: Guard Pages recovery links against root escape
        run: |
          set -euo pipefail
          ! grep -F 'href="/"' src/routes/__root.tsx
          grep -F 'Link to="/"' src/routes/__root.tsx >/dev/null
          grep -F 'import.meta.env.BASE_URL}favicon.ico' src/routes/__root.tsx >/dev/null

      - name: Build static SPA
        env:
          DEPLOY_BASE: /beyond-90-test/
        run: npm run build

      - name: Prepare SPA route fallbacks and deployment marker
        run: |
          set -euo pipefail
          test -f dist/client/_shell.html
          cp dist/client/_shell.html dist/client/index.html
          cp dist/client/_shell.html dist/client/404.html
          for route in cantera carrera historia legado onboarding patrimonio relaciones; do
            mkdir -p "dist/client/$route"
            cp dist/client/_shell.html "dist/client/$route/index.html"
          done
          printf '%s\n' "$GITHUB_SHA" > dist/client/__build_sha.txt
          test -f dist/client/historia/index.html
          test "$(cat dist/client/__build_sha.txt)" = "$GITHUB_SHA"
          grep -F '/beyond-90-test/favicon.ico' dist/client/index.html >/dev/null
          ! grep -F 'href="/favicon.ico"' dist/client/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live-https:
    name: Verify deployed HTTPS on iPhone WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy
    env:
      DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Install pinned Playwright WebKit
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps webkit

      - name: Verify lockfile stayed unchanged
        run: git diff --exit-code -- package-lock.json

      - name: Require exact deployed commit over HTTPS and direct SPA routes
        run: |
          set -euo pipefail
          test -n "$DEPLOYED_URL"
          case "$DEPLOYED_URL" in
            https://*) ;;
            *) echo "Pages did not return an HTTPS URL: $DEPLOYED_URL"; exit 1 ;;
          esac
          base="${DEPLOYED_URL%/}"
          deployed=""
          for i in {1..60}; do
            deployed="$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/__build_sha.txt?sha=$GITHUB_SHA&attempt=$i" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              break
            fi
            echo "Waiting for exact Pages commit: expected=$GITHUB_SHA observed=${deployed:-missing} attempt=$i"
            sleep 2
          done
          if [ "$deployed" != "$GITHUB_SHA" ]; then
            echo "Pages never served the deployed commit: expected=$GITHUB_SHA observed=${deployed:-missing}"
            exit 1
          fi
          for path in "" cantera carrera historia legado onboarding patrimonio relaciones; do
            if [ -n "$path" ]; then
              url="$base/$path?sha=$GITHUB_SHA"
            else
              url="$base/?sha=$GITHUB_SHA"
            fi
            curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$url" >/tmp/beyond90-live.html
            test -s /tmp/beyond90-live.html
          done
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "$base/favicon.ico?sha=$GITHUB_SHA" >/tmp/beyond90-favicon.ico
          test -s /tmp/beyond90-favicon.ico
          grep -F '/beyond-90-test/favicon.ico' /tmp/beyond90-live.html >/dev/null
          ! grep -F 'href="/favicon.ico"' /tmp/beyond90-live.html

      - name: iPhone WebKit Nueva carrera and persistence on live HTTPS
        env:
          BEYOND90_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/browser-smoke.mjs

      - name: iPhone WebKit save recovery and first-15 narrative playthrough on live HTTPS
        env:
          TEST_BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx playwright test scripts/browser-delivery.spec.cjs scripts/browser-first15.spec.cjs scripts/browser-missing-primary-recovery.spec.cjs scripts/browser-primary-write-fallback.spec.cjs scripts/browser-freshest-slot-recovery.spec.cjs --browser=webkit --reporter=line
