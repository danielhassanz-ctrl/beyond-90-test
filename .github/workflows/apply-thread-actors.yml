name: Apply narrative thread actors

on:
  push:
    branches:
      - narrative-p0-thread-actors
    paths:
      - scripts/apply-thread-actors.mjs
      - .github/workflows/apply-thread-actors.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: narrative-p0-thread-actors
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply player-visible narrative patch
        run: node scripts/apply-thread-actors.mjs
      - name: Typecheck
        run: npm ci && npm run typecheck
      - name: Remove one-shot patch machinery
        run: rm scripts/apply-thread-actors.mjs .github/workflows/apply-thread-actors.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/dynamic.ts scripts/apply-thread-actors.mjs .github/workflows/apply-thread-actors.yml
          git commit -m "Narrative P0: anchor recurring threads to persistent people" || exit 0
          git push origin HEAD:narrative-p0-thread-actors
