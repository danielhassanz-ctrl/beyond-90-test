name: First-15 cast continuity

on:
  push:
    branches:
      - main
      - "v1-*"
      - "p0-*"
  pull_request:
    branches:
      - main
    paths:
      - src/game/**
      - scripts/first15-cast-continuity-smoke.ts
      - .github/workflows/first15-cast-continuity.yml
      - docs/FOOTBALL_CAREER_STORY_DIRECTOR.md
      - qa/REAL_CAREER_PLAYTEST_GATE.md

permissions:
  contents: read

jobs:
  cast-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: First-15 persistent relationship continuity
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/first15-cast-continuity-smoke.ts
