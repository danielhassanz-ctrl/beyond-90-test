name: Beyond 90 visual milestone V1

on:
  push:
    branches:
      - main
    paths:
      - 'src/game/club-identity.ts'
      - 'src/lib/share.ts'
      - 'src/components/game/ShareButton.tsx'
      - 'scripts/visual-milestone-source-gate.mjs'
      - 'scripts/share-fallback-webkit-smoke.mjs'
      - '.github/workflows/visual-milestone-v1.yml'
  pull_request:
    paths:
      - 'src/game/club-identity.ts'
      - 'src/lib/share.ts'
      - 'src/components/game/ShareButton.tsx'
      - 'scripts/visual-milestone-source-gate.mjs'
      - 'scripts/share-fallback-webkit-smoke.mjs'
      - '.github/workflows/visual-milestone-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-milestone-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify clean dependency graph
        run: git diff --exit-code -- package-lock.json

      - name: Player photo + club identity milestone source gate
        run: node scripts/visual-milestone-source-gate.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build production SPA
        env:
          DEPLOY_BASE: /beyond-90-test/
        run: npm run build

      - name: Install WebKit runtime
        run: npx playwright install --with-deps webkit

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/b90-visual-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/beyond-90-test/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/b90-visual-preview.log
          exit 1

      - name: iPhone WebKit share fallback with persisted player photo
        env:
          BEYOND90_URL: http://127.0.0.1:4173/beyond-90-test/
        run: node scripts/share-fallback-webkit-smoke.mjs
