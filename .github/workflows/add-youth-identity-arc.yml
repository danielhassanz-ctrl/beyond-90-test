name: Add youth identity arc

on:
  push:
    branches:
      - recovery-v4-19-delivery-gate
    paths:
      - scripts/add-youth-identity-arc.mjs
      - .github/workflows/add-youth-identity-arc.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery-v4-19-delivery-gate
          fetch-depth: 0
      - name: Add youth identity arc
        run: node scripts/add-youth-identity-arc.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit arc
        shell: bash
        run: |
          if git diff --quiet -- src/game/director.ts; then
            echo "Youth identity arc already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/director.ts
          git commit -m "Add divergent youth identity narrative arc"
          git push origin HEAD:recovery-v4-19-delivery-gate
