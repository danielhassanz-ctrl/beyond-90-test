name: Narrative diversity one-shot

on:
  push:
    branches: [recovery-v4-19-delivery-gate]
    paths: ['.github/workflows/narrative-diversity-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-v4-19-delivery-gate
      - name: Diversify early narrative selection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/game/director.ts')
          s = p.read_text()
          old = '''  if (eligible.length > 0) {
    const id = eligible[hash(careerSeed(s), `open${s.sceneCount ?? 0}`) % eligible.length]!;
'''
          new = '''  if (eligible.length > 0) {
    // Mezcla contexto estable del jugador además de sceneCount. Dos carreras que
    // llegan al mismo punto temporal no deben abrir el mismo arco por inercia.
    const identity = `${d.profile}|${s.player.position}|${s.player.city}|${s.clubId}|${s.seasonIndex}`;
    const id = eligible[hash(careerSeed(s), `open|${identity}|${s.sceneCount ?? 0}`) % eligible.length]!;
'''
          if old not in s:
              raise SystemExit('openArc target not found')
          s = s.replace(old, new, 1)
          old2 = '''  // 4. Escena secundaria contextual: poco frecuente y nunca de relleno.
  const beatGap = 4 + (hash(careerSeed(s), `bgap${s.sceneCount ?? 0}`) % 4);
  if (beatNow - (d.lastBeatBeat ?? -99) < beatGap || sinceAny(s, d) < 3) return null;
  // Filtro extra reproducible: la mayoría de huecos se quedan en rutina.
  if (hash(careerSeed(s), `bchance${beatNow}${s.seasonIndex}`) % 100 >= 45) return null;
  const beats = BEATS.filter((b) => !seen(s, b.id) && !familyBlocked(s, b.family) && statusOk(s, b.family) && b.requires(s));
  if (beats.length > 0) {
    const h = hash(careerSeed(s), `beat${s.sceneCount ?? 0}`);
    const rare = beats.filter((b) => b.family === "rareza");
    const rareRoll = hash(careerSeed(s), `rare${beatNow}${s.seasonIndex}${s.sceneCount ?? 0}`) % 100;
    const beat = rare.length > 0 && rareRoll < 24
      ? rare[hash(careerSeed(s), `rarepick${s.sceneCount ?? 0}`) % rare.length]!
      : beats[h % beats.length]!;
'''
          new2 = '''  // 4. Escena secundaria contextual: mantiene aire entre escenas, pero la
  // selección incorpora identidad/perfil/club para evitar que carreras distintas
  // recorran el mismo catálogo en el mismo orden durante sus primeras temporadas.
  const identity = `${d.profile}|${s.player.position}|${s.player.city}|${s.clubId}`;
  const beatGap = 3 + (hash(careerSeed(s), `bgap|${identity}|${s.sceneCount ?? 0}`) % 4);
  if (beatNow - (d.lastBeatBeat ?? -99) < beatGap || sinceAny(s, d) < 3) return null;
  // Sigue habiendo rutina de fondo, pero con algo más de espacio para escenas
  // contextuales: la variedad no debe depender casi por completo de los arcos.
  if (hash(careerSeed(s), `bchance|${identity}|${beatNow}|${s.seasonIndex}`) % 100 >= 58) return null;
  const beats = BEATS.filter((b) => !seen(s, b.id) && !familyBlocked(s, b.family) && statusOk(s, b.family) && b.requires(s));
  if (beats.length > 0) {
    // Ordena por una puntuación específica de carrera, no por el orden fijo del
    // array BEATS. Esto evita secuencias gemelas incluso con elegibilidad parecida.
    const ranked = [...beats].sort((a, b) =>
      (hash(careerSeed(s), `rank|${identity}|${s.seasonIndex}|${s.sceneCount ?? 0}|${a.id}`) % 10000) -
      (hash(careerSeed(s), `rank|${identity}|${s.seasonIndex}|${s.sceneCount ?? 0}|${b.id}`) % 10000)
    );
    const rare = ranked.filter((b) => b.family === "rareza");
    const rareRoll = hash(careerSeed(s), `rare|${identity}|${beatNow}|${s.seasonIndex}|${s.sceneCount ?? 0}`) % 100;
    const beat = rare.length > 0 && rareRoll < 30
      ? rare[hash(careerSeed(s), `rarepick|${identity}|${s.sceneCount ?? 0}`) % rare.length]!
      : ranked[0]!;
'''
          if old2 not in s:
              raise SystemExit('beat selector target not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/narrative-diversity-fix.yml
          git config user.name "Beyond 90 QA"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Narrative: diversify early career scene order"
          git push origin HEAD:recovery-v4-19-delivery-gate
