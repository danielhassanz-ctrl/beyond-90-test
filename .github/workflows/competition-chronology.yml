name: Beyond 90 competition chronology

on:
  push:
    branches:
      - narrative-competition-chronology
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  chronology:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Competition chronology QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/competition-chronology-smoke.ts
      - name: Career pacing QA
        run: npm run qa:pacing
      - name: Full career smoke
        run: npm run qa:career
      - name: Build
        run: npm run build
