name: Beyond 90 overnight fix and report

on:
  push:
    branches: [recovery-v4-19-delivery-gate]
    paths: ['.github/workflows/overnight-fix-report.yml']

permissions:
  contents: write

jobs:
  fix-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-v4-19-delivery-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply diversity patch idempotently
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/game/director.ts')
          s=p.read_text()
          old='''  if (eligible.length > 0) {\n    const id = eligible[hash(careerSeed(s), `open${s.sceneCount ?? 0}`) % eligible.length]!;\n'''
          new='''  if (eligible.length > 0) {\n    const identity = `${d.profile}|${s.player.position}|${s.player.city}|${s.clubId}|${s.seasonIndex}`;\n    const id = eligible[hash(careerSeed(s), `open|${identity}|${s.sceneCount ?? 0}`) % eligible.length]!;\n'''
          if old in s:
              s=s.replace(old,new,1)
          old2='''  // 4. Escena secundaria contextual: poco frecuente y nunca de relleno.\n  const beatGap = 4 + (hash(careerSeed(s), `bgap${s.sceneCount ?? 0}`) % 4);\n  if (beatNow - (d.lastBeatBeat ?? -99) < beatGap || sinceAny(s, d) < 3) return null;\n  // Filtro extra reproducible: la mayoría de huecos se quedan en rutina.\n  if (hash(careerSeed(s), `bchance${beatNow}${s.seasonIndex}`) % 100 >= 45) return null;\n  const beats = BEATS.filter((b) => !seen(s, b.id) && !familyBlocked(s, b.family) && statusOk(s, b.family) && b.requires(s));\n  if (beats.length > 0) {\n    const h = hash(careerSeed(s), `beat${s.sceneCount ?? 0}`);\n    const rare = beats.filter((b) => b.family === "rareza");\n    const rareRoll = hash(careerSeed(s), `rare${beatNow}${s.seasonIndex}${s.sceneCount ?? 0}`) % 100;\n    const beat = rare.length > 0 && rareRoll < 24\n      ? rare[hash(careerSeed(s), `rarepick${s.sceneCount ?? 0}`) % rare.length]!\n      : beats[h % beats.length]!;\n'''
          new2='''  // 4. Escena secundaria contextual: diversidad real entre carreras.\n  const identity = `${d.profile}|${s.player.position}|${s.player.city}|${s.clubId}`;\n  const beatGap = 3 + (hash(careerSeed(s), `bgap|${identity}|${s.sceneCount ?? 0}`) % 4);\n  if (beatNow - (d.lastBeatBeat ?? -99) < beatGap || sinceAny(s, d) < 3) return null;\n  if (hash(careerSeed(s), `bchance|${identity}|${beatNow}|${s.seasonIndex}`) % 100 >= 58) return null;\n  const beats = BEATS.filter((b) => !seen(s, b.id) && !familyBlocked(s, b.family) && statusOk(s, b.family) && b.requires(s));\n  if (beats.length > 0) {\n    const ranked = [...beats].sort((a, b) =>\n      (hash(careerSeed(s), `rank|${identity}|${s.seasonIndex}|${s.sceneCount ?? 0}|${a.id}`) % 10000) -\n      (hash(careerSeed(s), `rank|${identity}|${s.seasonIndex}|${s.sceneCount ?? 0}|${b.id}`) % 10000)\n    );\n    const rare = ranked.filter((b) => b.family === "rareza");\n    const rareRoll = hash(careerSeed(s), `rare|${identity}|${beatNow}|${s.seasonIndex}|${s.sceneCount ?? 0}`) % 100;\n    const beat = rare.length > 0 && rareRoll < 30\n      ? rare[hash(careerSeed(s), `rarepick|${identity}|${s.sceneCount ?? 0}`) % rare.length]!\n      : ranked[0]!;\n'''
          if old2 in s:
              s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Run QA and capture report
        shell: bash
        run: |
          mkdir -p qa
          : > qa/overnight-status.txt
          echo "HEAD_BEFORE=$(git rev-parse HEAD)" >> qa/overnight-status.txt
          set +e
          npm run typecheck >> qa/overnight-status.txt 2>&1; echo "TYPECHECK_EXIT=$?" >> qa/overnight-status.txt
          npm run qa:career >> qa/overnight-status.txt 2>&1; echo "CAREER_EXIT=$?" >> qa/overnight-status.txt
          npm run qa:branches >> qa/overnight-status.txt 2>&1; echo "BRANCH_EXIT=$?" >> qa/overnight-status.txt
          node --import ./scripts/seed-ci-random.mjs --experimental-loader ./scripts/asset-loader.mjs --import tsx src/qa/run.ts >> qa/overnight-status.txt 2>&1; echo "EXTENDED_EXIT=$?" >> qa/overnight-status.txt
          npm run build >> qa/overnight-status.txt 2>&1; echo "BUILD_EXIT=$?" >> qa/overnight-status.txt
          set -e
      - name: Commit source and report
        run: |
          rm -f .github/workflows/overnight-fix-report.yml .github/workflows/narrative-diversity-fix.yml
          git config user.name "Beyond 90 QA"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Narrative: diversify early careers and record QA" || true
          git push origin HEAD:recovery-v4-19-delivery-gate
