name: Beyond 90 early arc diversity

on:
  push:
    branches: [recovery-v4-19-delivery-gate]
    paths: ['.github/workflows/early-arc-diversity.yml']

permissions:
  contents: write

jobs:
  patch-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-v4-19-delivery-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch director
        env:
          EARLY_ARCS_B64: "   "
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('src/game/director.ts')
          s=p.read_text()
          old='''    if ((d.preseasonUsed ?? 0) >= preMax) return null;\n    if (sinceAny(s, d) < 2) return null;\n'''
          new='''    if ((d.preseasonUsed ?? 0) >= preMax) return null;\n    if ((d.preseasonUsed ?? 0) > 0 && sinceAny(s, d) < 2) return null;\n'''
          if old in s:
              s=s.replace(old,new,1)
          if 'id: "arc_adaptacion_cantera"' not in s:
              marker='''  /* ---------------- 2. PRIMERA OPORTUNIDAD ---------------- */\n'''
              if marker not in s:
                  raise SystemExit('arc insertion marker missing')
              insert=base64.b64decode(os.environ['EARLY_ARCS_B64']).decode()
              s=s.replace(marker,insert+marker,1)
          p.write_text(s)
          PY
      - name: Install and QA
        run: npm install --no-audit --no-fund
      - name: Capture QA
        shell: bash
        run: |
          : > qa/overnight-status.txt
          echo "HEAD_BEFORE=$(git rev-parse HEAD)" >> qa/overnight-status.txt
          set +e
          npm run typecheck >> qa/overnight-status.txt 2>&1; echo "TYPECHECK_EXIT=$?" >> qa/overnight-status.txt
          npm run qa:career >> qa/overnight-status.txt 2>&1; echo "CAREER_EXIT=$?" >> qa/overnight-status.txt
          npm run qa:branches >> qa/overnight-status.txt 2>&1; echo "BRANCH_EXIT=$?" >> qa/overnight-status.txt
          node --import ./scripts/seed-ci-random.mjs --experimental-loader ./scripts/asset-loader.mjs --import tsx src/qa/run.ts >> qa/overnight-status.txt 2>&1; echo "EXTENDED_EXIT=$?" >> qa/overnight-status.txt
          npm run build >> qa/overnight-status.txt 2>&1; echo "BUILD_EXIT=$?" >> qa/overnight-status.txt
          set -e
      - name: Commit and remove one-shot
        run: |
          rm -f .github/workflows/early-arc-diversity.yml
          git config user.name "Beyond 90 QA"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Narrative: add divergent youth arcs and preseason reliability" || true
          git push origin HEAD:recovery-v4-19-delivery-gate
