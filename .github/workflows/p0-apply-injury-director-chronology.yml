name: P0 apply injury-director chronology guard

on:
  push:
    branches:
      - p0-first15-state-chronology
    paths:
      - scripts/fix-p0-injury-director-chronology.mjs
      - .github/workflows/p0-apply-injury-director-chronology.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-first15-state-chronology
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply injury chronology guard
        run: node scripts/fix-p0-injury-director-chronology.mjs
      - name: Commit generated Story Director change
        run: |
          if git diff --quiet -- src/game/director.ts; then
            echo "No director changes required"
            exit 0
          fi
          git config user.name "beyond90-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/game/director.ts
          git commit -m "P0: block on-field Story Director scenes while injured"
          git push origin HEAD:p0-first15-state-chronology
