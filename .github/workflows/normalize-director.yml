name: Normalize Narrative Director choices

on:
  push:
    branches:
      - recovery-v4-19-delivery-gate
    paths:
      - scripts/fix-director-choices.mjs
      - .github/workflows/normalize-director.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery-v4-19-delivery-gate
          fetch-depth: 0

      - name: Normalize choice arrays
        run: node scripts/fix-director-choices.mjs

      - name: Validate generated diff
        run: git diff --check

      - name: Commit normalized director
        shell: bash
        run: |
          if git diff --quiet -- src/game/director.ts; then
            echo "Director already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/director.ts
          git commit -m "Normalize Narrative Director to three-choice policy"
          git push origin HEAD:recovery-v4-19-delivery-gate
