name: Align Narrative Director QA

on:
  push:
    branches:
      - recovery-v4-19-delivery-gate
    paths:
      - scripts/update-narrative-diversity-qa.mjs
      - .github/workflows/update-narrative-qa.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery-v4-19-delivery-gate
          fetch-depth: 0
      - name: Update narrative diversity QA
        run: node scripts/update-narrative-diversity-qa.mjs
      - name: Validate diff
        run: git diff --check
      - name: Commit QA update
        shell: bash
        run: |
          if git diff --quiet -- src/qa/run.ts; then
            echo "Narrative QA already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/qa/run.ts
          git commit -m "Measure Narrative Director diversity in extended QA"
          git push origin HEAD:recovery-v4-19-delivery-gate
