name: Beyond 90 delivery gate

on:
  push:
    branches:
      - recovery-v4-19-delivery-gate
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Full career smoke QA
        run: npm run qa:career

      - name: Targeted narrative branch QA
        run: npm run qa:branches

      - name: Extended gameplay QA
        run: node --import ./scripts/seed-ci-random.mjs --experimental-loader ./scripts/asset-loader.mjs --import tsx src/qa/run.ts

      - name: Build
        run: npm run build
