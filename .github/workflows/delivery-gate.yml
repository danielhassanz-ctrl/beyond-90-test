name: Beyond 90 delivery gate

on:
  push:
    branches:
      - recovery-v4-19-delivery-gate
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: One-shot narrative variety pass 2
        if: contains(github.event.head_commit.message, 'CI: apply narrative pass2')
        run: |
          python3 scripts/apply-narrative-pass2.py
          rm -f .github/workflows/narrative-variety-pass2.yml
          rm -f scripts/apply-narrative-pass2.py
          git show HEAD^:.github/workflows/delivery-gate.yml > .github/workflows/delivery-gate.yml
          git config user.name "Beyond 90 QA"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Narrative: expand seeded early-career variety"
          git push origin HEAD:recovery-v4-19-delivery-gate
          exit 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Full career smoke QA
        run: npm run qa:career

      - name: Targeted narrative branch QA
        run: npm run qa:branches

      - name: Extended gameplay QA
        run: node --import ./scripts/seed-ci-random.mjs --experimental-loader ./scripts/asset-loader.mjs --import tsx src/qa/run.ts

      - name: Build
        run: npm run build
