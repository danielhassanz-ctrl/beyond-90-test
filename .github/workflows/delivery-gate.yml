name: Beyond 90 delivery gate

on:
  push:
    branches:
      - main
      - recovery-v4-19-delivery-gate
      - product-v4-20-polish
      - product-v4-21-memory-continuity
      - product-v4-22-life-wealth-pressure
      - product-v4-23-legacy-integration
      - "p0-*"
      - "v1-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Life and Patrimony chronology QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/money-life-chronology-smoke.ts
      - name: Decision/state coherence QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/decision-state-coherence-smoke.ts
      - name: Mandatory life-first opening QA
        run: npm run qa:opening
      - name: Career pacing QA
        run: npm run qa:pacing
      - name: Competition-aware pacing QA
        run: npm run qa:competition-pacing
      - name: Persistent career cast QA
        run: npm run qa:persistent-cast
      - name: Partner/social independence QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/partner-cast-smoke.ts
      - name: Full career smoke QA
        run: npm run qa:career
      - name: Targeted narrative branch QA
        run: npm run qa:branches
      - name: Narrative anti-repetition QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/narrative-quality-smoke.ts
      - name: Full-season boredom and repetition QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/full-season-boredom-smoke.ts
      - name: Narrative thread scheduler QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/thread-scheduler-smoke.ts
      - name: Match-flash source ban QA
        run: node scripts/match-flash-source-ban-smoke.mjs
      - name: Agent/market chronology QA
        run: node scripts/agent-market-chronology-smoke.mjs
      - name: Human-style first-15-decision QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/real-career-playtest-smoke.ts
      - name: First-15 decision quality floor
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/first15-quality-floor-smoke.ts
      - name: Alternative first-15 branch playtest
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/first15-branch-diversity-smoke.ts
      - name: Season title accounting QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/season-finance-title-bonus-smoke.ts
      - name: Retirement hard-cap QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/retirement-hard-cap-smoke.ts
      - name: Post-career Patrimony integration QA
        run: node --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/postcareer-finance-integration-smoke.ts
      - name: Extended gameplay QA
        run: node --import ./scripts/seed-ci-random.mjs --experimental-loader ./scripts/asset-loader.mjs --import tsx src/qa/run.ts
      - name: Build
        run: npm run build
