name: Beyond 90 delivery gate

on:
  push:
    branches:
      - recovery-v4-19-delivery-gate
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply agent cadence and QA semantic fix
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'APPLY_AGENT_CADENCE_AND_QA' }}
        run: |
          python3 scripts/fix-agent-cadence-and-qa.py
          rm -f scripts/fix-agent-cadence-and-qa.py
          git config user.name "Beyond 90 QA"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Narrative fix agent cadence and semantic experience QA"
          git push origin HEAD:recovery-v4-19-delivery-gate

      - name: Setup Node
        if: ${{ !(github.event_name == 'push' && github.event.head_commit.message == 'APPLY_AGENT_CADENCE_AND_QA') }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean install
        if: ${{ !(github.event_name == 'push' && github.event.head_commit.message == 'APPLY_AGENT_CADENCE_AND_QA') }}
        run: npm install --no-audit --no-fund

      - name: Typecheck
        if: ${{ !(github.event_name == 'push' && github.event.head_commit.message == 'APPLY_AGENT_CADENCE_AND_QA') }}
        run: npm run typecheck

      - name: Full career smoke QA
        if: ${{ !(github.event_name == 'push' && github.event.head_commit.message == 'APPLY_AGENT_CADENCE_AND_QA') }}
        run: npm run qa:career

      - name: Targeted narrative branch QA
        if: ${{ !(github.event_name == 'push' && github.event.head_commit.message == 'APPLY_AGENT_CADENCE_AND_QA') }}
        run: npm run qa:branches

      - name: Early experience overlap diagnostic
        if: ${{ !(github.event_name == 'push' && github.event.head_commit.message == 'APPLY_AGENT_CADENCE_AND_QA') }}
        run: node --import ./scripts/seed-ci-random.mjs --experimental-loader ./scripts/asset-loader.mjs --import tsx scripts/experience-diagnostic.ts

      - name: Extended gameplay QA
        if: ${{ !(github.event_name == 'push' && github.event.head_commit.message == 'APPLY_AGENT_CADENCE_AND_QA') }}
        run: node --import ./scripts/seed-ci-random.mjs --experimental-loader ./scripts/asset-loader.mjs --import tsx src/qa/run.ts

      - name: Build
        if: ${{ !(github.event_name == 'push' && github.event.head_commit.message == 'APPLY_AGENT_CADENCE_AND_QA') }}
        run: npm run build
